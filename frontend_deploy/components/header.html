<!-- header.html – Header/Nav Component -->
<header class="bg-surface-low p-3 flex justify-between items-center border-b border-surface-border/50">
  <div class="flex items-center gap-4">
    <h1 class="text-xl font-bold text-gold font-mono tracking-tight cursor-pointer" onclick="window.selectSymbol('RELIANCE')">IERL Command Center</h1>
    <div id="drift-status-container"></div>
  </div>
  
  <div class="flex items-center gap-3">
    <!-- Search Bar -->
    <div class="relative flex items-center">
      <input type="text" id="header-search-input" placeholder="Search ticker (e.g., TCS)..." 
             class="px-3 py-1.5 text-xs font-mono bg-surface-lowest text-white rounded-l border border-surface-border focus:border-gold outline-none w-48 transition-colors">
      <button id="header-search-btn" class="px-3 py-1.5 text-xs font-mono bg-gold/20 hover:bg-gold/30 text-gold rounded-r border border-l-0 border-gold/40 transition-colors">
        Search
      </button>
    </div>
    
    <span id="api-status" class="text-xs font-mono text-muted">API: CHECKING...</span>
    <button id="mobile-menu-btn" class="btn-secondary p-2 md:hidden" onclick="toggleMobileDrawer()"><span class="material-symbols-outlined text-gold">menu</span></button>
  </div>
</header>
