<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IERL Equity Intelligence OS — Institutional Command Center</title>
    <meta name="description" content="Indian cash-equity research prototype with transparent data and risk disclosures." />
    <meta name="theme-color" content="#18120d" />
    <meta name="ierl-api-base" content="" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="flex flex-col min-h-screen bg-surface-lowest text-gray-100">
    <!-- Header Component -->
    <header id="header-nav"></header>
    <!-- Drawer Overlay -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="toggleMobileDrawer()"></div>
    <!-- Mobile Drawer -->
    <aside id="mobile-drawer" class="mobile-drawer md:hidden flex flex-col py-4 px-3"></aside>
    <!-- Sidebar Navigation -->
    <nav id="sidebar-nav" class="hidden md:flex bg-surface-low fixed left-0 top-0 h-full flex-col py-6 w-64 border-r z-20"></nav>
    <!-- AI Assistant Dock -->
    <aside id="aiassistant-dock" class="hidden lg:flex fixed right-0 top-0 h-full w-96 bg-surface-low border-l z-20"></aside>
    <!-- Main Canvas -->
    <main class="flex-1 md:ml-64 lg:mr-96 p-4 md:p-6 pb-20" id="main-canvas">
        <section id="conviction-panel" class="mb-6"></section>
        <section id="scorecard-panel" class="mb-6"></section>
        <section id="cagr-matrix-panel" class="mb-6"></section>
        <section id="thesis-panel" class="mb-6"></section>
        <section id="lifecycle-panel" class="mb-6"></section>
        <section id="timeline-panel" class="mb-6"></section>
        <section id="compare-panel" class="mb-6"></section>
        <section id="multibagger-screener-panel" class="mb-6"></section>
        <section id="probability-panel" class="mb-6"></section>
        <section id="swing-alerts-panel" class="mb-6"></section>
        <section id="watchlist-panel" class="mb-6"></section>
    </main>
    <!-- Footer -->
    <footer id="footer"></footer>
    <!-- Bootstrap loader -->
    <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
