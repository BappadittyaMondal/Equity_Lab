name: Equity Lab CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Check code formatting with Black
        run: black --check . --exclude "/(venv|\.venv|\.git)/"
        continue-on-error: true
        
      - name: Check security vulnerabilities with Safety
        run: safety check --full-report
        continue-on-error: true

      - name: Scan repository for real secrets and credentials
        run: python scripts/check_no_real_secrets.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov anyio pandas numpy scipy scikit-learn pydantic fastapi uvicorn httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run full regression test suite
        env:
          ENV: test
          OFFLINE_TEST_MODE: true
        run: |
          python -m pytest app/tests/ -m "not network" --tb=short
